name: Daily Market Data Update

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check application files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html")
          if not html.is_file():
              raise FileNotFoundError("index.html がありません")

          content = html.read_text(encoding="utf-8")
          required = [
              "nasdaqClose",
              "soxClose",
              "intradayChart",
              "intradayModels",
          ]

          missing = [x for x in required if x not in content]
          if missing:
              raise ValueError(f"必要な要素がありません: {missing}")

          print("HTMLファイルの確認成功")
          print("GitHub Actionsのテスト成功")
          PY
